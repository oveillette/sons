    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
        }

        #scroll-container {
            width: 100vw;
            height: 100vh;
            overflow: auto;
            display: grid;
            place-items: center;
        }

        #zoom-wrapper {
            position: relative;
            transform-origin: center center;
            transition: transform 0.2s ease-in-out;
            width: 1918px;
            height: 1069px;
            flex-shrink: 0;
            margin: 50vh 50vw;
        }

        #image-container {
            position: relative;
            width: 1918px;
            height: 1069px;
        }

        img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            z-index: 999;
        }

        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10000;
        }

        .zoom-btn {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            border: none;
            background: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>

    <script>
        let currentZoom = 1;
        const scroller = document.getElementById('scroll-container');
        const wrapper = document.getElementById('zoom-wrapper');

        function applyZoom() {
            wrapper.style.transform = `scale(${currentZoom})`;
        }

        function initZoom() {
            const scaleX = window.innerWidth / 1918;
            const scaleY = window.innerHeight / 1069;
            currentZoom = Math.min(scaleX, scaleY);
            applyZoom();
            setTimeout(centerScroll, 50);
        }

        function centerScroll() {
            const centerX = wrapper.offsetLeft + (wrapper.offsetWidth / 2) - (window.innerWidth / 2);
            const centerY = wrapper.offsetTop + (wrapper.offsetHeight / 2) - (window.innerHeight / 2);
            scroller.scrollTo(centerX, centerY);
        }

        function changeZoom(amount) {
            currentZoom += amount;
            if (currentZoom < 0.05) currentZoom = 0.05;
            applyZoom();
        }

        function resetZoom() {
            initZoom();
        }

        function playSound(soundId) {
            const audio = document.getElementById(soundId);
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
                audio.play().catch(e => {});
            }
        }

        window.onload = initZoom;
        window.onresize = initZoom;
    </script>
